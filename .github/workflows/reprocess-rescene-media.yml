name: Reprocess RESCENE media

on:
  push:
    paths:
      - '.github/workflows/reprocess-rescene-media.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger temporary Supabase media reprocessor
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            'https://hukrrzhltiyirtkxmotj.supabase.co/functions/v1/bootstrap-rescene-media' \
            -H 'Content-Type: application/json' \
            -d '{}'
