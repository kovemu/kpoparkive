name: BTS31 One-Off Render Publish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/namu-bts31-oneoff.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://hukrrzhltiyirtkxmotj.supabase.co/functions/v1/namu-bts31-proxy"
      KPOPARKIVE_BASE_URL: "https://kpoparkive.vercel.app"
      KPOPARKIVE_FORCE_DOM_FALLBACK_UNTRANSLATED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install minimal renderer dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kpop-deps
          cd /tmp/kpop-deps
          npm init -y >/dev/null 2>&1
          npm install node-html-parser@7.0.1 --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/kpop-deps/node_modules node_modules

      - name: Render canonical source for 31 articles
        shell: bash
        run: |
          set -euo pipefail
          fresh_token() {
            curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=namu-bts31" |
              node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))'
          }
          titles=(
          "A.R.M.Y"
          "RM"
          "방탄소년단"
          "방탄소년단/공연 및 행사"
          "방탄소년단/관련 장소"
          "방탄소년단/광고 및 캐릭터 상품"
          "방탄소년단/굿즈"
          "방탄소년단/기록"
          "방탄소년단/논란 및 사건 사고"
          "방탄소년단/대중매체"
          "방탄소년단/멤버 간 케미"
          "방탄소년단/세계관"
          "방탄소년단/수상"
          "방탄소년단/여담"
          "방탄소년단/연혁"
          "방탄소년단/영화 및 다큐"
          "방탄소년단/위상 및 인기"
          "방탄소년단/음반"
          "방탄소년단/음악 방송 직캠"
          "방탄소년단/응원법"
          "방탄소년단/콘텐츠"
          "뷔"
          "빌보드 200"
          "빌보드 핫 100"
          "슈가(방탄소년단)"
          "오피셜 싱글 차트"
          "오피셜 차트"
          "정국"
          "제이홉"
          "지민"
          "진(방탄소년단)"
          )
          for title in "${titles[@]}"; do
            echo "=== SOURCE RENDER: $title ==="
            token="$(fresh_token)"
            echo "::add-mask::$token"
            SUPABASE_SERVICE_ROLE_KEY="$token" npm run namu:engine-thetree-compat -- "$title"
          done

      - name: Render English content for 31 articles
        shell: bash
        run: |
          set -euo pipefail
          fresh_token() {
            curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=namu-bts31" |
              node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))'
          }
          titles=(
          "A.R.M.Y"
          "RM"
          "방탄소년단"
          "방탄소년단/공연 및 행사"
          "방탄소년단/관련 장소"
          "방탄소년단/광고 및 캐릭터 상품"
          "방탄소년단/굿즈"
          "방탄소년단/기록"
          "방탄소년단/논란 및 사건 사고"
          "방탄소년단/대중매체"
          "방탄소년단/멤버 간 케미"
          "방탄소년단/세계관"
          "방탄소년단/수상"
          "방탄소년단/여담"
          "방탄소년단/연혁"
          "방탄소년단/영화 및 다큐"
          "방탄소년단/위상 및 인기"
          "방탄소년단/음반"
          "방탄소년단/음악 방송 직캠"
          "방탄소년단/응원법"
          "방탄소년단/콘텐츠"
          "뷔"
          "빌보드 200"
          "빌보드 핫 100"
          "슈가(방탄소년단)"
          "오피셜 싱글 차트"
          "오피셜 차트"
          "정국"
          "제이홉"
          "지민"
          "진(방탄소년단)"
          )
          for title in "${titles[@]}"; do
            echo "=== ENGLISH RENDER: $title ==="
            token="$(fresh_token)"
            echo "::add-mask::$token"
            SUPABASE_SERVICE_ROLE_KEY="$token" npm run namu:engine-thetree-content -- "$title"
          done

      - name: Prepublish integration QA
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=namu-bts31")"
          token="$(printf '%s' "$token_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          echo "::add-mask::$token"
          SUPABASE_SERVICE_ROLE_KEY="$token" npm run namu:integration-qa -- 방탄소년단 --prepublish --strict --expected-count=31

      - name: Publish 31-article BTS scope
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=namu-bts31")"
          token="$(printf '%s' "$token_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          echo "::add-mask::$token"
          SUPABASE_SERVICE_ROLE_KEY="$token" npm run namu:publish -- --root=방탄소년단

      - name: Final integration QA
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=namu-bts31")"
          token="$(printf '%s' "$token_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          echo "::add-mask::$token"
          SUPABASE_SERVICE_ROLE_KEY="$token" npm run namu:integration-qa -- 방탄소년단 --strict --expected-count=31
