          )
          for title in "${titles[@]}"; do
            echo "=== ENGLISH RENDER: $title ==="
            npm run namu:engine-thetree-content -- "$title"
          done

      - name: Prepublish integration QA
        run: npm run namu:integration-qa -- 방탄소년단 --prepublish --strict --expected-count=31

      - name: Publish 31-article BTS scope
        run: npm run namu:publish -- --root=방탄소년단

      - name: Final integration QA
        run: npm run namu:integration-qa -- 방탄소년단 --strict --expected-count=31
