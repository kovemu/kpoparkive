name: BTS31 Artifact Asset Scan

on:
  push:
    branches: [main]
    paths: [".github/workflows/namu-bts31-artifact-scan.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://hukrrzhltiyirtkxmotj.supabase.co/functions/v1/namu-bts31-proxy"
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: |
          mkdir -p /tmp/scan && cd /tmp/scan
          npm init -y >/dev/null 2>&1
          npm install node-html-parser@7.0.1 --no-audit --no-fund
      - name: auth
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=namu-bts31")"
          oidc="$(printf '%s' "$oidc_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          session_json="$(curl -fsSL -X POST -H "Authorization: Bearer $oidc" "$NEXT_PUBLIC_SUPABASE_URL/session")"
          session="$(printf '%s' "$session_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).token))')"
          echo "::add-mask::$session"
          echo "SUPABASE_SERVICE_ROLE_KEY=$session" >> "$GITHUB_ENV"
      - name: RM anchor alignment probe
        shell: bash
        run: |
          cat >/tmp/scan/probe.mjs <<'NODE'
          import { parse } from "node-html-parser";
          import { gunzipSync } from "node:zlib";
          const base=process.env.NEXT_PUBLIC_SUPABASE_URL.replace(/\/$/,""), key=process.env.SUPABASE_SERVICE_ROLE_KEY;
          const headers={apikey:key,Authorization:"Bearer "+key};
          async function db(p){const r=await fetch(base+"/rest/v1/"+p,{headers});const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}
          const [doc]=await db("source_documents?source=eq.namu_mirror&source_title=eq."+encodeURIComponent("RM")+"&select=id,source_title,source_namumark_meta,source_browser_capture_meta&limit=1");
          const rows=await db("source_asset_queue?source_document_id=eq."+doc.id+"&asset_type=eq.image&status=eq.resolved&select=label,source_ref,resolved_url,storage_path,metadata&limit=1000");
          const st=doc.source_browser_capture_meta.artifact_storage;
          const p=st.article_path.split("/").map(encodeURIComponent).join("/");
          let r=await fetch(base+"/storage/v1/object/authenticated/"+encodeURIComponent(st.bucket)+"/"+p,{headers});
          let b=Buffer.from(await r.arrayBuffer()); if(st.encoding==="gzip")b=gunzipSync(b);
          const root=parse(b.toString("utf8"));
          const imgs=root.querySelectorAll("img");
          const urls=[];
          for(const img of imgs){
            const candidates=[img.getAttribute("src"),img.getAttribute("data-src"),img.getAttribute("data-original"),img.getAttribute("data-lazy-src")].filter(Boolean);
            const ss=img.getAttribute("srcset")||""; for(const q of ss.split(",")){const u=q.trim().split(/\s+/)[0];if(u)candidates.push(u)}
            for(const u of candidates)if(/^https?:\/\//i.test(u))urls.push(u);
          }
          const uniq=[...new Set(urls)];
          const req=doc.source_namumark_meta.requiredFiles||[];
          function matchIndex(row){
            const sp=String(row?.storage_path||"");
            if(sp){
              const idx=uniq.findIndex(x=>{try{return decodeURIComponent(new URL(x).pathname).includes(sp)}catch{return String(x).includes(sp)}});
              if(idx>=0)return {idx,key:sp,via:"storage_path"};
            }
            const o=row?.metadata?.original_url||row?.metadata?.browser_candidate_url||row?.metadata?.source_url||"";
            if(!o)return null;
            let idx=uniq.indexOf(o);
            if(idx<0){
              try{const ou=new URL(o);idx=uniq.findIndex(x=>{try{const u=new URL(x);return u.pathname===ou.pathname}catch{return false}})}catch{}
            }
            return idx>=0?{idx,key:o,via:"original_url"}:null;
          }
          const anchors=[];
          for(const row of rows){
            const m=matchIndex(row); if(!m)continue;
            anchors.push({file:row.label||row.source_ref,url:m.key,index:m.idx,via:m.via});
          }
          anchors.sort((a,b)=>a.index-b.index);
          const rawHtml=b.toString("utf8");
          const anchorPos=rawHtml.indexOf("알엠");
          console.log("ANCHOR_SNIPPET", anchorPos>=0 ? rawHtml.slice(Math.max(0,anchorPos-2200),anchorPos+2600) : "not-found");
          console.log("FIRST_IMGS", JSON.stringify(imgs.slice(0,12).map((img,i)=>({
            i,
            html:img.toString().slice(0,800),
            parent:img.parentNode?.toString?.().slice(0,1200)||""
          })),null,2));
          console.log("PROBE",JSON.stringify({
            requiredFiles:req.length,
            htmlImgElements:imgs.length,
            urlOccurrences:urls.length,
            uniqueUrls:uniq.length,
            resolvedRows:rows.length,
            anchorsFound:anchors.length,
            firstAnchors:anchors.slice(0,25)
          },null,2));
          NODE
          cd /tmp/scan && node probe.mjs
