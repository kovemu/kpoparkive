name: BTS31 Asset Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/namu-bts31-assets.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://hukrrzhltiyirtkxmotj.supabase.co/functions/v1/namu-bts31-proxy"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install minimal worker dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kpop-deps
          cd /tmp/kpop-deps
          npm init -y >/dev/null 2>&1
          npm install node-html-parser@7.0.1 playwright-core@1.63.0 --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/kpop-deps/node_modules node_modules

      - name: Exchange GitHub OIDC for render-proxy session
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=namu-bts31")"
          oidc="$(printf '%s' "$oidc_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          session_json="$(curl -fsSL -X POST -H "Authorization: Bearer $oidc" "$NEXT_PUBLIC_SUPABASE_URL/session")"
          session="$(printf '%s' "$session_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).token))')"
          echo "::add-mask::$session"
          echo "SUPABASE_SERVICE_ROLE_KEY=$session" >> "$GITHUB_ENV"

      - name: Patch renderer-missing scope to v9
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/raw-required-v8/raw-required-v9/g' scripts/namu-browser-image-worker.mjs
          grep -n "raw-required-v9" scripts/namu-browser-image-worker.mjs

      - name: Repair renderer-missing BTS assets only
        shell: bash
        run: |
          set -euo pipefail
          npm run namu:repair-assets -- --root "방탄소년단" --renderer-missing --headless --limit 220 --delay 900
