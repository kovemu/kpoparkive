name: BTS31 Route DOM Probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/namu-bts31-final-diagnostic.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Probe visible DOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null 2>&1
          npm install node-html-parser@7.0.1 --no-audit --no-fund >/dev/null
          curl -fsSL -A 'kpoparkive-route-probe/1.0' 'https://kpoparkive.vercel.app/w/A.R.M.Y' -o page.html
          node - <<'NODE'
          const fs=require('fs');
          const {parse}=require('node-html-parser');
          const html=fs.readFileSync('page.html','utf8');
          console.log('FULL_RAW_LINK='+(/\[\[[^\]]+\]\]/.test(html)));
          const m=html.match(/\[\[[^\]]+\]\]/);
          if(m) {
            const i=m.index||0;
            console.log('FULL_CONTEXT='+html.slice(Math.max(0,i-180),i+360).replace(/\s+/g,' '));
          }
          const root=parse(html);
          for(const selector of ['script','style','noscript','template']) {
            for(const node of root.querySelectorAll(selector)) node.remove();
          }
          const visible=root.toString();
          console.log('VISIBLE_RAW_LINK='+(/\[\[[^\]]+\]\]/.test(visible)));
          console.log('VISIBLE_INCLUDE='+(/\[include\s*\(/i.test(visible)));
          console.log('VISIBLE_DIRECTIVE='+( /\{\{\{#!(?:wiki|folding|if)/i.test(visible)));
          console.log('VISIBLE_TEXT_HAS_ARMY='+root.innerText.includes('A.R.M.Y'));
          NODE
