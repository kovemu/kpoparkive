name: Apply full-page visual editor canvas patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-page-canvas-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch editor and API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def before(s, marker, block, label):
              if marker not in s: raise SystemExit(f"marker missing: {label}")
              return s.replace(marker, block + marker, 1)
          def after(s, marker, block, label):
              if marker not in s: raise SystemExit(f"marker missing: {label}")
              return s.replace(marker, marker + block, 1)
          def one(s, old, new, label):
              if old not in s: raise SystemExit(f"marker missing: {label}")
              return s.replace(old, new, 1)

          p = Path("app/w/FullPageVisualEditorV2.tsx")
          s = p.read_text()

          s = before(s, "type HeadingSurfaceRecord = {", '''type GenericTextSurfaceRecord = {
            sectionKey: string;
            originalText: string;
            surface: HTMLElement;
            cleanup: () => void;
          };

          ''', "generic type")
          s = before(s, ".kpoparkivePageEditSurface,\n", '''.thetreeWikiBaseline.kpoparkiveWholePageEditCanvas {
            outline: 2px solid rgba(107, 60, 232, .42);
            outline-offset: 10px;
            border-radius: 4px;
            box-shadow: 0 0 0 5px rgba(107, 60, 232, .035);
          }
          .kpoparkiveGenericTextSurface {
            border: 0;
            border-radius: 3px;
            outline: 0;
            background: transparent;
            color: inherit;
            caret-color: #6b3ce8;
            cursor: text;
          }
          .kpoparkiveGenericTextSurface:hover {
            background: rgba(107, 60, 232, .055);
            box-shadow: 0 0 0 2px rgba(107, 60, 232, .055);
          }
          .kpoparkiveGenericTextSurface:focus {
            background: rgba(107, 60, 232, .08);
            box-shadow: 0 0 0 2px rgba(107, 60, 232, .18);
          }
          ''', "canvas css")
          s = after(s, "  const directSurfacesRef = useRef<DirectSurfaceRecord[]>([]);\n", "  const genericTextSurfacesRef = useRef<GenericTextSurfaceRecord[]>([]);\n", "generic ref")
          s = after(s, "  const restoreSurfaces = () => {\n", "    for (const item of genericTextSurfacesRef.current.slice().reverse()) item.cleanup();\n    genericTextSurfacesRef.current = [];\n", "generic cleanup")
          s = before(s, "    document.body.classList.remove(\"kpoparkivePageEditing\");\n", "    document.querySelector<HTMLElement>(\".thetreeWikiBaseline\")?.classList.remove(\"kpoparkiveWholePageEditCanvas\");\n", "canvas cleanup")

          builder = r'''  const buildGenericTextSurfaces = (sectionRoots: Map<number, HTMLElement>) => {
            const article = document.querySelector<HTMLElement>(".thetreeWikiBaseline");
            if (!article) return;
            article.classList.add("kpoparkiveWholePageEditCanvas");
            const excludedSelector = [
              ".kpoparkivePageEditSurface", ".kpoparkiveTableInlineSurface", ".kpoparkiveTemplateInlineSurface",
              ".kpoparkiveHeadingEditSurface", ".kpoparkiveDirectOriginalHolder",
              "[data-kpoparkive-page-edit-hidden='1']", "[data-kpoparkive-direct-hidden='1']",
              ".wiki-heading", ".wiki-edit-section", ".wiki-toc", ".wiki-macro-toc",
              ".kpoparkivePageEditorToolbar", ".kpoparkivePageEditorStatus", ".kpoparkiveGenericInspector",
              "script", "style", "textarea", "input", "button", "select", "option",
              "iframe", "video", "audio", "canvas", "svg", "math", "noscript", "nav",
            ].join(",");
            const roots = Array.from(sectionRoots.entries());
            const sectionKeyForNode = (node: Node) => {
              for (const [sectionIndex, root] of roots) if (root.contains(node)) return `section:${sectionIndex}`;
              return "section:0";
            };
            const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT);
            const nodes: Text[] = [];
            for (let current = walker.nextNode(); current; current = walker.nextNode()) if (current instanceof Text) nodes.push(current);
            for (const node of nodes) {
              if (!node.isConnected) continue;
              const parent = node.parentElement;
              const raw = node.nodeValue || "";
              const match = raw.match(/^(\s*)([\s\S]*?\S)(\s*)$/);
              if (!parent || !match || parent.closest(excludedSelector)) continue;
              if (parent.closest("[contenteditable='true'], [contenteditable='plaintext-only'], [hidden], [aria-hidden='true']")) continue;
              const style = window.getComputedStyle(parent);
              if (style.display === "none" || style.visibility === "hidden") continue;
              const [_, prefix, originalText, suffix] = match;
              if (!normalized(originalText)) continue;
              const prefixNode = document.createTextNode(prefix);
              const suffixNode = document.createTextNode(suffix);
              const surface = document.createElement("span");
              surface.className = "kpoparkiveGenericTextSurface";
              surface.contentEditable = "plaintext-only";
              surface.spellcheck = true;
              surface.textContent = originalText;
              const sectionKey = sectionKeyForNode(parent);
              surface.dataset.sectionKey = sectionKey;
              surface.dataset.editorKind = "generic-text";
              surface.addEventListener("focus", () => activateSection(sectionKey, surface, null));
              surface.addEventListener("click", (event) => { if ((event.target as Element | null)?.closest("a")) event.preventDefault(); });
              surface.addEventListener("keydown", (event) => { if (event.key === "Enter") event.preventDefault(); });
              parent.insertBefore(prefixNode, node);
              parent.insertBefore(surface, node);
              parent.insertBefore(suffixNode, node);
              node.remove();
              genericTextSurfacesRef.current.push({
                sectionKey, originalText, surface,
                cleanup: () => {
                  if (!surface.isConnected && !prefixNode.isConnected && !suffixNode.isConnected) return;
                  const anchor = prefixNode.isConnected ? prefixNode : surface;
                  const host = anchor.parentNode;
                  if (host) host.insertBefore(document.createTextNode(raw), anchor);
                  prefixNode.remove(); surface.remove(); suffixNode.remove();
                },
              });
            }
          };

          '''
          s = before(s, "  const buildSurfaces = (data: PagePayload, preferredSectionIndex: number | null) => {", builder, "generic builder")
          s = before(s, "    document.body.classList.add(\"kpoparkivePageEditing\");\n", "    buildGenericTextSurfaces(sectionRoots);\n", "generic build call")
          s = one(s, "      ? [...surfacesRef.current.map((item) => ({ sectionKey: item.sectionKey, surface: item.surface })), ...directSurfacesRef.current]\n", "      ? [...surfacesRef.current.map((item) => ({ sectionKey: item.sectionKey, surface: item.surface })), ...directSurfacesRef.current, ...genericTextSurfacesRef.current]\n", "preferred generic")
          s = before(s, "  const templateHasChanges = () => Boolean(payload?.templates.some((template) => {", '''  const genericTextChanges = () => genericTextSurfacesRef.current
            .map((item) => ({ sectionKey: item.sectionKey, originalText: item.originalText, proposedText: item.surface.textContent || "" }))
            .filter((item) => item.proposedText !== item.originalText);

          ''', "generic changes")
          s = after(s, "    const headings = headingChanges();\n", '''    const genericTexts = genericTextChanges();
            if (genericTexts.some((item) => item.proposedText.includes("\\n") || item.proposedText.includes("\\r"))) {
              window.alert("Inline page text cannot contain line breaks yet. Use Paragraph or Heading insertion for new blocks.");
              return;
            }
          ''', "collect generic")
          s = one(s, "    if (!blockChanges.length && !tableChanges.length && !templateChanges.length && !headings.length && !insertions.length) {", "    if (!blockChanges.length && !tableChanges.length && !templateChanges.length && !headings.length && !genericTexts.length && !insertions.length) {", "no changes")
          s = after(s, "          headingChanges: headings.map(({ sectionKey, proposedWikitext, level }) => ({ sectionKey, proposedWikitext, level })),\n", "          genericTextChanges: genericTexts,\n", "post generic")
          s = one(s, "    const changed = insertions.length || textChanged || tableChanged || headingChanges().length || templateHasChanges();", "    const changed = insertions.length || textChanged || tableChanged || headingChanges().length || genericTextChanges().length || templateHasChanges();", "cancel generic")
          s = one(s, "Whole page editing · headings, text, tables and templates · Insert location:", "Whole page canvas · all visible text is directly editable · headings, tables and templates keep structured editing · Insert location:", "status copy")
          p.write_text(s)

          p = Path("app/api/wiki-edit-document-v2/route.ts")
          s = p.read_text()
          s = before(s, "type Insertion = { sectionKey?: string; wikitext?: string };", "type GenericTextChange = { sectionKey?: string; originalText?: string; proposedText?: string };\n", "api type")
          helper = r'''function sectionBodyLineRange(lines: string[], sectionKey: string) {
            const wanted = sectionIndexFromKey(sectionKey);
            if (wanted < 0) throw Object.assign(new Error("Invalid text section"), { status: 400 });
            if (wanted === 0) {
              const end = lines.findIndex((line) => HEADING_RE.test(line));
              return { start: 0, end: end < 0 ? lines.length : end };
            }
            let sectionIndex = 0, start = -1, end = lines.length;
            for (let i = 0; i < lines.length; i += 1) {
              if (!HEADING_RE.test(lines[i])) continue;
              sectionIndex += 1;
              if (sectionIndex === wanted) { start = i + 1; continue; }
              if (start >= 0 && sectionIndex > wanted) { end = i; break; }
            }
            if (start < 0) throw Object.assign(new Error("The edited section no longer exists. Reload and try again."), { status: 409 });
            return { start, end };
          }

          function replaceGenericVisibleText(source: string, change: GenericTextChange) {
            const sectionKey = String(change.sectionKey || "").trim();
            const originalText = String(change.originalText || "");
            const proposedText = String(change.proposedText ?? "");
            if (!sectionKey || !originalText || originalText.length > 4000 || proposedText.length > 4000) throw Object.assign(new Error("Invalid visual text edit"), { status: 400 });
            if (/[\r\n]/.test(originalText) || /[\r\n]/.test(proposedText)) throw Object.assign(new Error("Inline visual text edits must stay on one line"), { status: 400 });
            if (originalText === proposedText) return { source, changed: false };
            const lines = source.replace(/\r\n?/g, "\n").split("\n");
            const range = sectionBodyLineRange(lines, sectionKey);
            const segment = lines.slice(range.start, range.end).join("\n");
            const matches: number[] = [];
            for (let at = segment.indexOf(originalText); at >= 0; at = segment.indexOf(originalText, at + Math.max(1, originalText.length))) {
              const open = segment.lastIndexOf("[[", at), closed = segment.lastIndexOf("]]", at);
              if (open > closed) {
                const close = segment.indexOf("]]", at + originalText.length);
                if (close >= 0 && /^(?:파일|file):/i.test(segment.slice(open + 2, close).trim())) continue;
              }
              matches.push(at);
            }
            if (!matches.length) throw Object.assign(new Error(`Rendered text could not be mapped safely to NamuMark in ${sectionKey}. It may be generated by a template or macro.`), { status: 409 });
            if (matches.length > 1) throw Object.assign(new Error(`Rendered text is ambiguous in ${sectionKey}. Edit a larger fragment or use the structured editor.`), { status: 409 });
            const at = matches[0];
            let updated = segment;
            const open = segment.lastIndexOf("[[", at), closed = segment.lastIndexOf("]]", at);
            if (open > closed) {
              const close = segment.indexOf("]]", at + originalText.length);
              if (close >= 0) {
                const innerStart = open + 2, inner = segment.slice(innerStart, close), pipe = inner.indexOf("|"), relative = at - innerStart;
                if (pipe < 0) {
                  if (inner !== originalText) throw Object.assign(new Error("This link label cannot yet be mapped safely. Use the Link tool."), { status: 409 });
                  updated = `${segment.slice(0, open)}[[${inner}|${proposedText}]]${segment.slice(close + 2)}`;
                } else {
                  if (relative <= pipe) throw Object.assign(new Error("Editing a link target as plain text is not supported. Use the Link tool."), { status: 409 });
                  updated = `${segment.slice(0, at)}${proposedText}${segment.slice(at + originalText.length)}`;
                }
              }
            } else updated = `${segment.slice(0, at)}${proposedText}${segment.slice(at + originalText.length)}`;
            lines.splice(range.start, range.end - range.start, ...updated.split("\n"));
            return { source: lines.join("\n"), changed: true };
          }

          '''
          s = before(s, "function insertAtSectionEnd(source: string, sectionKey: string, wikitext: string) {", helper, "api helper")
          s = after(s, "      headingChanges?: HeadingChange[];\n", "      genericTextChanges?: GenericTextChange[];\n", "api shape")
          s = before(s, "    for (const insertion of body.insertions || []) {", '''    for (const textChange of body.genericTextChanges || []) {
              const result = replaceGenericVisibleText(proposed, textChange);
              if (!result.changed) continue;
              proposed = result.source;
              changeLabels.push(`Page text: ${String(textChange.originalText || "").slice(0, 80)}`);
            }

          ''', "api apply")
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/full-page-canvas-patch.yml
      - name: Commit patch
        run: |
          git config user.name "kovemu-editor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/w/FullPageVisualEditorV2.tsx app/api/wiki-edit-document-v2/route.ts .github/workflows/full-page-canvas-patch.yml
          git commit -m "feat: make visual editor a whole-page text canvas"
          git push origin HEAD:main
